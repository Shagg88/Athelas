; ============================================================================
; Athelas / ROTKFix — Example Standalone Mod Configuration
; ============================================================================
; Place this file alongside MyMod.dll in your game's ROTKFix\mods\ directory:
;   <GameFolder>\ROTKFix\mods\MyMod.dll
;   <GameFolder>\ROTKFix\mods\MyMod.ini
;
; The Athelas Launcher and ROTKFix will automatically discover and display
; this mod in the Mods tab and respect the Enabled switch.

[Mod]
Name = Example Standalone Mod
Description = Template demonstrating an external code mod (.dll) with custom settings and Athelas launcher integration.
Author = Community Developer
Version = 1.0.0
Category = Gameplay
Enabled = 1
Games = rotk-pc, rotk-xbox, all
DLL = MyMod.dll
Hotkeys = F8 (Toggle Feature)

; Custom mod settings (read via standard GetPrivateProfile* Win32 APIs in your C/C++ code)
[Settings]

; Example configuration values
Multiplier = 150
EffectColor = 0, 200, 255
