; ROTKPlus as a mod of Athelas: this file and ROTKPlus.dll (built with build.sh) go into <game folder>\ROTKFix\mods\.
; This is its entry in the launcher's Mods tab, where it is turned on and off (Enabled).
; ROTKPlus' own settings are not here: they are in ROTKPlus.ini in the game folder, next to rotk.exe (an example with
; every key: ROTKPlus.ini.example in the Athelas sources, mods/ROTKPlus, or config/ROTKPlus.ini.example of the ROTKPlus
; repository; without it the defaults are used, with co-op for 3 and 4 players
; on), and the statistics (ROTKPlus_players.ini) and the logs (ROTKPlus_logs) stay there too, as with the
; DivxMediaLib.dll install. If that install is also there, only one of the two changes the game (the log says which).

[Mod]
Name = ROTKPlus
Description = Co-op with 3 and 4 players and a Versus mode for up to 4 (teams, heroes only, timed games, tournaments), each player with a name and statistics of their own (the Fellowship pages in the main menu).
Author = brig-dev
Version = 1.4.1
Category = Gameplay
Enabled = 0
Games = rotk-pc
DLL = ROTKPlus.dll
Hotkeys = none: everything is in the main menu (Multiplayer, Fellowship)
