[Mod]
Name = Valar Boons
Description = Mythological blessings and boons from the Valar (Manwë, Varda, and Aulë). Bestows elemental wind damage, starlight holy shield & retribution, and heavy crushing strikes with damage clamping.
Author = Athelas Community
Version = 1.1.0
Category = Gameplay
Enabled = 0
Games = rotk-pc, rotk-xbox
DLL = ValarBoons.dll
Hotkeys = 1 (Manwë), 2 (Varda), 3 (Aulë), 4 (Awaken Group), 0 (Reset)

[General]
; Total number of boons defined below ([Boon1] .. [BoonN])
BoonCount = 3

; Global hotkeys (comma-separated: numbers, F-keys, Numpad, etc.)
EnableAllKey = 4, F4, Num4
ResetKey = 0, F10, Num0

; Visual overlays
ShowHud = 1
ShowAura = 1

; ----------------------------------------------------------------------------
; Boon Configurations
; Properties:
;   Name             : Display name shown in HUD and notifications
;   Title            : Aspect / blessing title
;   Description      : Summary text for in-game notifications
;   Key              : Activation hotkeys (comma-separated)
;   Group            : Group ID (0 = independent; >0 = shared group cooldown & mutual exclusivity)
;   Color            : Red, Green, Blue (0-255) for HUD badges and screen-edge aura
;   Duration         : Active duration in seconds (0 = stays active until manually toggled)
;   Cooldown         : Wait seconds before activating again (single number or curve progression,
;                      e.g. 5, 10, 20. The last number is the permanent max wait seconds)
;   DamageMultiplier : Outgoing damage percentage (e.g. 160 = +60% damage, 100 = normal)
;   FlatDamage       : Flat bonus damage added to player attacks
;   DamageReduction  : Incoming damage reduction percentage (e.g. 75 = 75% damage absorbed)
;   MaxDamageClamped : Maximum damage taken from a single hit (e.g. 10; 0 = no clamp)
;   HolyShockDamage  : Retribution damage dealt back to attackers (0 = none)
; ----------------------------------------------------------------------------

