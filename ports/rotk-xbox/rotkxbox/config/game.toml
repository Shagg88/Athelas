# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# ---- The Return of the King hooks (appended to game.toml by the config build) ----
[[hook]]                   # XapiInitProcess: failed disc authentication (0x121C84 < 0) -> continue instead of booting to the dashboard (0x121EE4)
at = 0x00121EBE
call = "ROTK_DiscCheckFailed"
on_true = 0x00121EC3

[[hook]]                   # frame end: the wait for a vertical blank since the last frame (skipped above 30 fps)
at = 0x000D03D3
call = "ROTK_FrameWait"
on_true = 0x000D03F1
