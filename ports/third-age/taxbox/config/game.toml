# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]
# proven by hand from the game's own code (D3D8LTCG 5849): API argument order, where each is taken
CDevice_KickOff                         = ["edx"]
D3DDevice_DrawVertices                  = ["stack", "ecx", "eax"]          # type on the stack, start (ebx += 0x100 a batch), count ((n-1)>>8)
D3DDevice_SelectVertexShader            = ["eax", "ebx"]                   # handle, address
D3DDevice_LoadVertexShader              = ["eax", "stack"]                 # handle, address (ret 4); copies the program into the push buffer
D3DDevice_SetFlickerFilter              = ["esi"]                            # level
D3DDevice_SetPalette                    = ["eax", "stack"]                   # stage, palette (ret 4)
D3DDevice_SetTextureState_BorderColor   = ["eax", "ebx"]                     # stage, colour
D3DDevice_SetTextureState_BumpEnv       = ["eax", "stack", "stack"]          # stage, type, value (ret 8)
D3DDevice_SetTextureState_ColorKeyColor = ["eax", "ebx"]                     # stage, colour
D3DDevice_SetIndices                    = ["ebx", "stack"]                 # index buffer (refcounted), base vertex
D3DDevice_SetPixelShader                = ["eax"]
D3DDevice_SetShaderConstantMode         = ["eax"]
D3DDevice_SetStreamSource               = ["eax", "ebx", "stack"]          # stream (x12), buffer (refcounted), stride
D3DDevice_SetTexture                    = ["eax", "stack"]                 # stage, texture
D3DDevice_SetTextureState_TexCoordIndex = ["esi", "stack"]
D3DDevice_SetTransform                  = ["eax", "edx"]                   # state, matrix (16 dwords copied)
D3DDevice_Swap                          = ["eax"]
D3DResource_IsBusy                      = ["eax"]
D3D_InternalRelease                     = ["esi"]
D3D_MakeRequestedSpace                  = ["stack", "eax"]                 # callers: push size/2 (minimum), eax = size (requested)
# adapter, device type and focus window are not read (registers it doesn't use); flags in eax, the presentation
# parameters on the stack, the returned device in ecx
Direct3D_CreateDevice                   = ["edx", "ebx", "esi", "eax", "stack", "ecx"]


[[hook]]                   # frame end: the wait for a vertical blank since the last frame (skipped above 30 fps)
at = 0x001C0A70
call = "TA_FrameWait"
on_true = 0x001C0A81

[[hook]]                   # the game has just set its TV-safe border ([0x304E70] across, [0x30AF98] down); zeroed
at = 0x000D900F            # unless [graphics] safe_area (ta_widescreen.cpp TA_SafeArea)
call = "TA_SafeArea"

[[hook]]
at = 0x000D906D
call = "TA_SafeArea"

[[hook]]
at = 0x000D90D2
call = "TA_SafeArea"

[[hook]]                   # font texture made from the FNTS chunk at eax (sharp_text, ta_sharptext.cpp)
at = 0x001C1860
call = "TA_FontMade"

[[hook]]                   # Evil Mode's lock in the save list (unlock_all, ta_gameplay.cpp)
at = 0x001EAD68
call = "TA_EvilUnlocked"
on_true = 0x001EAD96
